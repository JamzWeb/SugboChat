<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SugboChat - Anonymous Cebuano Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --online-green: #22c55e;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --my-msg: #f59e0b;
      --partner-msg: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .online-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 4px 10px;
      border-radius: 9999px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--online-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--online-green);
    }

    #online-count-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: #86efac;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    /* Status Bar */
    .status-bar {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      font-size: 0.85rem;
      color: var(--text-sub);
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .status-bar strong {
      color: var(--text-main);
    }

    /* Chat Log */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.my-message {
      align-self: flex-end;
      background-color: var(--my-msg);
      color: #1a1a1a;
      border-bottom-right-radius: 2px;
      font-weight: 500;
    }

    .message.partner-message {
      align-self: flex-start;
      background-color: var(--partner-msg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    .system-banner {
      align-self: center;
      background-color: rgba(51, 65, 85, 0.4);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 9999px;
      margin: 8px 0;
    }

    /* Quick Bisaya Phrase Chips */
    .chips-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--border-color);
      white-space: nowrap;
      scrollbar-width: none;
    }

    .chips-container::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
